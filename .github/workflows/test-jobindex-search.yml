name: "test: jobindex-search"

on:
  push:
    branches: [main]
    paths:
      - "skills/jobindex-search/**"
  pull_request:
    branches: [main]
    paths:
      - "skills/jobindex-search/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: skills/jobindex-search/cli
        run: bun install

      - name: Run tests
        working-directory: skills/jobindex-search/cli
        run: bun test
