name: New skill
description: Propose a new Denmark-focused agent skill backed by a real website or data source.
title: "[new skill] "
labels:
  - new skill
  - status: pending
body:
  - type: markdown
    attributes:
      value: |
        Suggest a skill based on a real user need and a real data source.

        Good issues start from the human task first:
        "What would a person in Denmark go to the web to figure out?"

        Then identify the best source:
        official API, hidden frontend JSON, HTML pages, feeds, documents, or a combination.

  - type: textarea
    id: user-problem
    attributes:
      label: User problem
      description: Describe the real-world task this skill should help with.
      placeholder: |
        A person in Denmark wants help comparing used cars, checking market prices, and spotting suspicious listings.
    validations:
      required: true

  - type: textarea
    id: target-users
    attributes:
      label: Who is this for?
      description: Describe the people or situations this skill is meant to support.
      placeholder: |
        Private buyers, families, commuters, renters, patients doing background research, job seekers, etc.
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: Candidate websites or data sources
      description: List the primary site first, then any secondary sources worth combining.
      placeholder: |
        Primary:
        - https://www.bilbasen.dk/

        Secondary:
        - https://motorst.dk/se-oplysninger-i-motorregistret
        - https://fdm.dk/motor/biltest
    validations:
      required: true

  - type: dropdown
    id: access-method
    attributes:
      label: Likely access method
      description: Pick the most likely first approach. This can change after research.
      options:
        - Unknown yet
        - Official API
        - Hidden frontend JSON or network endpoints
        - HTML scraping
        - Feed, sitemap, or document parsing
        - Mixed approach
    validations:
      required: true

  - type: textarea
    id: key-actions
    attributes:
      label: What should the agent be able to do?
      description: Describe the concrete user-facing jobs the skill should support.
      placeholder: |
        - Search listings with filters
        - Fetch details for one result
        - Compare options
        - Show price history or market context
        - Alert on new matches
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Useful output
      description: What should a good response from the future skill contain?
      placeholder: |
        JSON list of matches with title, price, location, link, and notable attributes.
        Optional detail command with history, seller info, and risk flags.
    validations:
      required: true

  - type: textarea
    id: research-notes
    attributes:
      label: What do we already know?
      description: Include any quick findings about robots.txt, search filters, pagination, auth, or visible JSON data.
      placeholder: |
        Search works without login.
        Results page appears to fetch JSON in the browser.
        Detail pages include structured script data.
        Some sections may require cookies or bot mitigation.
    validations:
      required: false

  - type: dropdown
    id: user-value
    attributes:
      label: User value
      description: How valuable would this be for an ordinary person in Denmark?
      options:
        - Very high
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: build-risk
    attributes:
      label: Build risk
      description: How hard or brittle does this look before research?
      options:
        - Low
        - Medium
        - High
        - Unknown
    validations:
      required: true

  - type: textarea
    id: legal-practical
    attributes:
      label: Constraints or concerns
      description: Note anything about login, rate limits, anti-bot behavior, personal data, or unclear terms.
      placeholder: |
        No obvious API docs.
        May require careful throttling.
        Avoid personal account data.
        Keep the first version read-only.
    validations:
      required: false

  - type: textarea
    id: success
    attributes:
      label: What would make this issue done?
      description: Define a practical success target for the first version of the skill.
      placeholder: |
        A self-contained skill with search and detail commands, documented JSON output, live tests, and registration in skills-lock.json.
    validations:
      required: true
